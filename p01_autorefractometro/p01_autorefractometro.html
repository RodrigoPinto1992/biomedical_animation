<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Animación Única</title>
</head>
<body>
    <!--EMETROPE-->
    <div class="etiqueta" id="primera-etiqueta">Ojo emetrope</div>
    <div class="animation">
        <img src="imagenes/luz_emetrope.png" class="luz" id="luz-emetrope">
        <img src="imagenes/ojo.png" class="ojo">
    </div>
    <!--MIOPE-->
    <div class="etiqueta">Ojo miope</div>
    <div class="animation">
        <img src="imagenes/luz_miope.png" class="luz" id="luz-miope">
        <img src="imagenes/ojo.png" class="ojo">
    </div>
    <!--HIPERMETROPE-->
    <div class="etiqueta">Ojo hipermetrope</div>
    <div class="animation">
        <img src="imagenes/luz_hipermetrope.png" class="luz" id="luz-hipermetrope">
        <img src="imagenes/ojo.png" class="ojo">
    </div>
    <!--BOTONES-->
    <div class="boton">
        <button id="btnAnimar">Activar haz infrarrojo</button>
        <button id="btnBorrar">Apagar haz infrarrojo</button>
    </div>
    <script src="js/botones.js"></script> 
</body>
</html>
